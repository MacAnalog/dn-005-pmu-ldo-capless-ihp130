# Candidate manifest (analog-db circuit shape, kept LOCAL to this design repo — see
# doc/journal/analog-db-has-no-overlay-root.md). lab.dut resolves circuits/<id>/ before the
# analog-db submodule root, so `lab.dut.Design(circuit="ldo_ihp_capless")` renders every class
# bench through analog-db's own assemble() exactly as the reference does.
#
# Topology of record (experiment 002): a DOUBLE-MIRROR flipped-voltage-follower (FVF) output
# stage — pass PMOS XMP; control PMOS XMC whose source IS the output; XMC's current folded through
# an NMOS 1:1 mirror (XMA/XMB) and a PMOS 1:1 mirror (XMCP/XMD) onto the pass gate as a pull-up;
# constant sink XMS pulling the gate down — under a slow, high-gain outer loop: a two-stage
# PMOS-input error amplifier (5T OTA + Miller-compensated common source) compares the divided
# output with the (ideal) reference and sets the FVF control voltage. The FVF's local loop is the
# fast transient path (the control device's transient current, not a standing bias, pulls the gate
# up; the sink's I_B / C_gate sets the pull-down slew); the outer loop sets DC accuracy, PSRR and
# load/line regulation. The fold (not a plain FVF) is what lets the gate reach vdd so the pass
# device turns OFF at hot/fast corners — see experiments/002-literature/README.md §2b. Bias is
# resistor-referenced (no ideal current sources): one NMOS diode behind a poly resistor from the
# rail, mirrored to the sink and, via a PMOS diode, to the error-amp tail.
schema: spicexplorer/circuit@1
id: ldo_ihp_capless
class: ldo
display_name: "Capless low-Iq LDO: double-mirror FVF output stage + two-stage error amp, resistor-referenced bias (IHP SG13G2, 1.5 V lv devices)"
compensation: "Miller cap across error-amp stage 2 (dominant pole at ea_o1); nothing at the pass gate (any C there is paid at the sink slew)"
stages: 3                        # error amp stage 1 + stage 2 + FVF output stage (control device, fold, pass device)
ports: [vdd, vout, vss]          # reference (ideal VREF) + bias generated INTERNALLY
provenance:
  source: experiments/002-literature/README.md
  aliases: [ldo_fvf, capless_ldo]
  designer: "Danial Noori Zadeh"
artifacts:

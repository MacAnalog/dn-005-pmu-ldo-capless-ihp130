- id: it05
  note: 'CFF/CC plates swapped vs the certified card: cap_cmim is polarised, nodes[0] is the top plate
    -> read the assignment from the netlist'
  detail: 'Round 5. DRC 3, LVS mismatch on exactly two devices. (1) The LVS cross-reference named CFF
    and CC (and nets fb/lp_brk/ea_o1/ea_out): cap_cmim is a POLARISED device class, so the certified card
    fixes which node is the top plate - nodes[0] is PLUS/top, nodes[1] the Metal5 bottom. Round 4 followed
    brief section 9 (sensitive terminal on top, since kpex does not extract the top plate) and inverted
    both. The generator now reads the assignment off the certified card; the brief''s preference is a
    re-sizing question because the bottom-plate parasitic would move to the other node. (2) M2.b x2: the
    Metal1->Metal3 hop pads were 0.6 um, which alloc''s 0.6 um column pitch does not clear; they are VPAD
    now and registered as obstacles. (3) V1.a x1: a shifted column 0.6 um from a MIM plate pad merged
    its Via1 with the pad''s 3x3 array; to_track now pushes such a column at least 0.95 um clear.'

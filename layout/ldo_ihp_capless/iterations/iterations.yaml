- id: it03
  note: gate merged into vout at the comb spine; XR2 split 212/85/42 by a stub walking the port row ->
    Metal3 escape + claimed pads
  detail: 'Round 3. DRC was 0 and LVS was not: the extracted netlist showed net ''gate|vout'' and XR2
    as three resistors. Four causes, four fixes. (1) XMP''s gate left its island on a Metal2 column at
    the array''s left edge, which is exactly where the vout Metal2 comb spine runs - two overlapping Metal2
    shapes merge, so DRC is silent; the gate now hops the spine and both guard rings on Metal3 (Builder.to_track_m3).
    (2) The rhigh end pads of the divider comb were not in the Metal1 obstacle map, so a to_track stub
    walked along the port row and tapped XR2 twice; every segment end is now claimed and only the four
    terminal pads are retagged to their net. (3) The vdd/vss rails were likewise unclaimed. (4) The MIM
    plate pads started at Metal2, so when alloc shifted the column the Metal1 stub never reached the plate
    and XCFF''s bottom plate extracted as an unnamed net; the pads now start at Metal1.'

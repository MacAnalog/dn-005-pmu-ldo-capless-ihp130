- id: it04
  note: 'V1.b x128: MIM pad + to_track both stacked Via1 at one point; vout split at the climb landing;
    XR2 links -> Metal3'
  detail: 'Round 4. DRC 129 and LVS still split. (1) V1.b x128 / V1.a: the MIM plate pads now reach Metal1,
    so to_track''s own Metal1->Metal2 stack landed on top of the plate pad''s 3x3 Via1 array - two overlapping
    arrays merge into shapes of the wrong size and spacing. to_track(term_stack=False) leaves the pad''s
    own stack alone, and the XCOUT vss ties no longer add one. (2) The vout channel track and the vout
    TopMetal1 strap extracted as two nets (vout and vout): Builder.climb landed on the track at an x the
    track was never drawn out to, because climb did not register the landing in track_pts. (3) XR2''s
    series links ran on Metal2 at the port row, which is exactly where the fb / lp_brk Metal2 columns
    leave the comb; they are on Metal3 now, and XR1''s Metal1 links are claimed in the obstacle map.'

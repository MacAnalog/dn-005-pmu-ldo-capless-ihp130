- id: it11
  note: 'Metal2 comb registered per-layer + gate track on Metal3 + ea_in_pair leftmost: DRC 0, LVS matched,
    PM 68.76->69.30'
  detail: 'Fix round for layout review-003 (blockers F1-F3, majors F4-F9, minors F10-F14).


    Router: ObstacleMap is layer-aware. Every vertical carries its layer and claim_box() records an

    arbitrary drawn rectangle, so the pass array''s Metal2 comb (fingers + two 6 um spines, drawn by the

    power path as plain rects) is finally an obstacle. That closes the gate|vout short class the

    reviewer reproduced at col_vias 3 and 4, and it removes the hard-coded to_track_m3: gate''s track
    is

    now Metal3 (TRACK_LAYER), so the comb is simply not on its layer. Same-net columns now keep the

    via-pad pitch too - two ea_n columns 0.38 um apart merge legally on Metal2 but put their Via1 cuts

    0.19 um apart (V1.b).


    Geometry: the pass device''s gate stand-off is derived from the drain via pad (at col_vias 4 the

    drain Metal1 reached 0.08 um into the gate bar); the n-well ring''s Metal2 riser reaches the source

    spine at any ring_gap (at 3.0 the pass bulk extracted as an unnamed node); the right cell edge is

    placed by TopMetal1 spacing to the XCOUT block, so pwr_w 1.64-8 and vss_ret_w 0.8-6 are all legal.


    Floorplan: ea_in_pair is the first group of row B (fb 107 -> 79.6 um) and bias_p_group takes the

    long trip. Common-centroid members reserve a MIRRORED COLUMN PAIR before the general allocator runs

    - the XOR of the two halves'' own routing is 0.000-0.011 um2 with equal via counts, against 64.7 %

    and 32.8 %. Dummies are sized to the slot they stand beside, not to the widest slot in the group.

    XRB is on res_pitch with a tied dummy at each end. vss return: bottom rail plus TWO edge risers at

    vss_ret_w = 3.0 (hand model 32 -> ~3 ohm) and ONE vss label. lp_brk escapes to the right edge beside

    vout, so the divider senses at the output pin. pwr_w 2.0 -> 4.0 (hand model: vdd 1.20 -> 0.60 ohm,

    vout 1.11 -> 0.56 ohm, dropout adder 30.5 -> 15.2 mV).


    Sign-off: DRC and LVS now BLOCK; a new bounds stage walks both ends of every documented range

    (40/40 build + DRC 0 + LVS matched + current density pass); the per-net C table keeps every net;

    kpex runs with the run dir as its cwd so its stray <cell>_extracted.cir lands inside it.


    Measured: area 42 231 -> 44 266 um2 (+4.8 %). CC per-net to-rail C: gate 34.45, fb 21.20, ea_o1

    43.92, ea_out 16.75 fF. Post-layout 18/18 PASS, S7 127.6 mV, PM 69.30 (was 68.76). Gate-only what-if

    S7 201.7 mV (was 204.5) - still over 150 and NOT closed by routing: gpad 0.5 -> 0.34, i.e. 32 % less

    gate-bar area, buys 0.30 fF of 34.45, so the term is the pass array''s own gate structure, which the

    certified finger count sets. RC still emits an 8548-card R mesh with ZERO nodes in common with the

    33 device pins (kpex 0.3.12), so 5 of 13 benches abort and the R is electrically absent.

    '

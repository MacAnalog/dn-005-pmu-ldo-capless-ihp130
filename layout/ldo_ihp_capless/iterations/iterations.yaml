- id: it02
  note: 'M2.c1 x77: comb Via1 stack overhung the 0.31 um Metal2 finger -> endcap enclosure; own guard
    ring; dummy blanket'
  detail: 'Round 2. Five fixes from round 1: (1) the pass-array comb''s Metal1 stub and Metal2 finger
    now enclose the col_vias via column by 0.10 um (M2.c1 x77 -> 0); (2) ihp.cells.guard_ring replaced
    by Builder.ring, because the PDK cell''s corner contact arrays violate Cnt.b at every corner (measured
    standalone at 7 width/spacing combinations) (Cnt.b x14 -> 0); (3) each dummy device is one Metal1
    blanket rather than per-column ties, which left a 0.09 um notch against its own gate bar (M1.b x8
    -> 0); (4) the n-well fill comes from the ring itself instead of a wider hand rect that the outer
    p-substrate ring then sat on (NW.f x2 -> 0); (5) rb_segs 4 -> 5 so XRB''s segment length is 27.7 um
    and not 34.625 um, which put the rhigh cell''s own geometry off-grid (OffGrid/Sal.e/Rhi.d x14 -> 0).
    A sixth, Act.b x6, appeared once the rings were mine: the two row-B n-well islands were 0.20 um apart
    and merged into one well; isl_gap now holds NW.b 0.62 + both rings.'

- id: it12
  note: 'vss cliff is shared impedance, not width: XCOUT gets its own strap to the pin, right riser deleted
    -> return 4.9 ohm, 40/40 endpoints clean'
  detail: 'Second round of the fix, after the brief author re-derived every budget on the re-certified

    schematic row (BRIEF.md @ 223373e). Two brief changes drive it.


    F9''s MECHANISM changed. The re-derived brief §4a splits the vss injection: with only the ACTIVE

    devices behind 32 ohm S7 moves +0.44 mV (nothing), and with only XCOUT''s bottom plate behind it S7

    IMPROVES to 103.2 mV (ESR-zero damping). The 11 ohm cliff needs BOTH halves behind one R - Cout''s

    load-step displacement current develops a ground bounce the FVF sources and the EA read as a

    reference step. So the fix is a CONNECTION, not a width: the vss pin is now the foot of the single

    left-edge riser, the active devices reach it down that riser alone, and XCOUT''s four bottom plates

    reach the same pin along the bottom rail on their own vss_ret_w-wide straps. The right-edge riser

    of the previous round is DELETED - it would have put the active current back onto the cap''s return

    rail, which is the shared impedance the cliff is made of. Hand model: common series element 4.9

    ohm, worst-device total including the cell rail in parallel with the ptap ring 14.3 ohm, against

    the brief''s 16 ohm active-only budget (S6, -0.4553 dB/ohm).


    F3''s TARGET changed: gate to-rail 29.3 -> 12 fF, with a measured step between 12 and 13 fF, and

    gate->vout re-bracketed at 40 fF (26x cheaper per fF). The drawn cell is 34.45 fF to-rail and 8.91

    fF to vout. Two new measurements settle what layout can do about it. (1) dev_gap 3.2 -> 6.0

    lengthens the Metal3 gate track 50.77 -> 59.17 um and moves gate to-rail 34.45 -> 34.95 fF, i.e.

    0.060 fF/um, so the WHOLE track is worth 3.0 fF and a vout shield under it can convert at most that

    into the 26x-cheaper column - 13 % of the 22.5 fF shortfall. (2) A sizing sweep at

    x_dut_xmp_nf_mult = 2 gives gate 33.70 total / 26.63 fF to-rail, i.e. 3.9 fF of to-rail per unit

    finger multiple, so the extrapolated floor at nf_mult -> 0 is ~18.8 fF - still above 12 fF, and

    nf_mult = 2 is already 1.46x over the Metal1 current-density limit on the shared S/D column. 12 fF

    is therefore not reachable by routing OR by any legal sizing; it is a spec/topology ruling for the

    owner and is filed as one.


    Verdicts unchanged by the F9 change, as expected - the CC extraction carries no R, so a return-path

    topology fix cannot show in it: DRC 0, LVS matched, current density 30/30 worst 0.836x, kpex CC

    186 C / 21 R, post-layout 18/18 PASS with S7 127.558 mV and PM 69.301 deg, area 44 266 um2.

    The pwr_w = 4.0 hand model re-scored against the brief''s new pooled rule: 10.34 x 0.598 + 8.64 x

    0.556 = 10.98 mV of the 23.83 mV dropout pool (46 %), where pwr_w = 2.0 spends 21.98 mV (92 %).


    Two further generator fixes found by re-walking the ranges after this round''s changes, both

    verified byte-identical at the record sizing: XRB''s five segment end pads are now CLAIMED in the

    obstacle map (the divider''s already were), and the XCOUT array starts at `x_pass_r` instead of a

    fixed x = 1.0 um. At res_pitch = 3.0 the XRB block slid right to x = -2..16 and XCOUT''s

    bottom-plate drop - 3.0 um wide since the Kelvin return, 0.6 um before it - ran straight down

    through it, so the five-segment string extracted as vss-27.7-$23, vss-27.7-nbias, vss-55.4-vdd.

    `x_pass_r` had been computed and never used.

    '

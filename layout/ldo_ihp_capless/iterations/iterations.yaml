- id: it10
  note: 'certified deck re-issued on the drawn device set (F19): Iq 36.28->33.81 uA, S7 104.8->115.1 mV'
  detail: 'Commit 1 of the fix round: `decks/candidate` re-certified so the certified netlist and the
    LVS reference are the same text (review-003 F19, adopted). The drawn device set moves into `circuits/.../netlist.spice`:
    XMB0/XMB1/XMS/XM1..XM4 as named half-width A/B cards, XR1/XR2 as eight-segment strings and XRB as
    five, XMP as m=76 unit fingers of 2.5 um. The generator''s slot tables now name those cards, so a
    matched member is a certified device rather than a split `--combine_devices` happens to tolerate,
    and `xmp_nf_mult` / `r_segs` / `rb_segs` leave `LayoutParams` for `sizing.yaml`. Attribution measured
    on the certified deck: 91 % of the -2.47 uA Iq shift is the bias-branch halving, 8 % the resistor
    segmentation, and the pass finger split is +0.015 uA, i.e. free. The GDS changes with it (sha 226bf2ea

    at the stitched one. `postlayout.py` selects by `sorted(Path(a.pex).rglob("*_pex_netlist.
    spice"))` and requires exactly one match -- and `..._stitched.spice` does NOT match that
    glob, so the selection finds exactly one file, reports no ambiguity, and measures the RAW
    netlist. I hit this: I had to symlink the stitched file under the expected name to run the
    benches on it at all. This is review-003 F17 in a new form -- the check is for ambiguity, not
    for identity -- and it is worse than the old `hits[-1]` because it fails silently and
    confidently.
  effect: {metric: null, delta: null, unit: null, model: what-if, detail: "an RC scorecard produced through this path would be the unstitched netlist, i.e. exactly the artifact F1 says measures nothing"}
  fix:
    knob: "layout/postlayout.py"
    to: "take the netlist path from the PEX stage's record, not from a glob"
    note: >-
      `signoff.json` already carries `pex.netlist`; read it. If a glob has to stay, prefer
      `*_stitched.spice` when one exists and say which file was used in the printed line (it
      prints the path today, which is how I caught it).
  expected: "the file the extractor named is the file the benches measure"
  verdict: open


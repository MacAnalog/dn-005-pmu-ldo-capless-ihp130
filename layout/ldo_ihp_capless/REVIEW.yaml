- id: F25
  severity: minor
  category: pex
  title: "no pin labels reach kpex, so the stitcher's tie point is arbitrary"
  where:
    - {kind: point, x: -65.5, y: 69.55}
    - {kind: point, x: 133.64, y: 0.0}
    - {kind: point, x: -70.0, y: -134.0}
  evidence: >-
    The cell's own kpex report database has **594 `[Device Terminal]` markers and zero `[Pin]`
    markers** (`zcat ldo_ihp_capless_k25d_pex_report.rdb.gz | grep -c '\[Pin'` = 0), even though
    the schematic kpex is given declares six ports
    (`.subckt ldo_ihp_capless vdd vout vss vref lp_brk fb`) and the GDS carries 17 text labels
    (14 on Metal1 8/25, one on Metal3 30/25, two on TopMetal1 126/25). So the stitcher has device
    terminals to anchor but no PORT anchor, and it has to tie each flat net to the mesh at a node
    it picks: for `vdd` that is `vdd.P0.25`, for `vout` `vout.P0.25`, for `vss` `vss.P0.24` --
    polygon 0 of a layer, not the pin. Consequence, and it is the whole reason a series-R budget
    exists: a resistance measured from the subckt port is a resistance from an arbitrary point in
    the net, not from the pad the brief's `vdd` / `vout` / `vss_active` budgets are defined to.
    The `vss` numbers happen to come out right because that net's tie landed on the bottom rail
    near the pin; nothing guarantees that for the next build.
  effect: {metric: null, delta: null, unit: null, model: hand, detail: "every port-referred series-R number from the extractor is referred to an arbitrary node until the pins are labelled"}
  fix:
    knob: "gen_ldo.py pin labelling"
    to: "text + pin-datatype shape per port on the pin's own layer"
    note: >-
      Draw each of the six ports as a label AND a pin-datatype polygon on the layer the pin lives
      on (vdd/vout on TopMetal1 126/2 + 126/25 at the strap ends, vss on Metal1 8/2 + 8/25 at the
      riser foot, vref/fb/lp_brk likewise), so kpex's LVS pass emits `[Pin]` nodes and the
      stitcher ties the flat net AT THE PIN. This is also what F13 asks for from the other side:
      one label per pin, on the declared edge.
  expected: "port-referred R becomes pin-referred R, and the brief's series-R rows become directly checkable"
  verdict: open


findings:

- id: F9
  severity: major
  category: budget
  title: "vss active return is 20.9 Ohm measured, not the 14.3 Ohm the report models"
  where:
    - {kind: box, layer: Metal1drawing, x0: -71.5, y0: -135.5, x1: -68.5, y1: 0.3}
    - {kind: line, points: [[-70.0, 0.0], [-3.4, 0.0]]}
    - {kind: device, name: XMSb, x0: 95.72, y0: 1.42, x1: 97.35, y1: 2.88}
    - {kind: point, x: -70.0, y: -134.0}
  evidence: >-
    REPORT section 6.4 models the worst-case active device at 14.3 Ohm against the re-derived
    brief's 16.4772 Ohm `vss_active` budget -- "89 % spent". I solved it instead of modelling it:
    rasterize every Metal1 shape at 0.1 um, flood-fill the component that contains the `vss` pin
    (-70.0, -134.0), and solve Laplace at the PDK's 110 mOhm/sq (validated against an analytic
    bar to -0.1 %). Results: the common series element (pin -> riser top at y = 0) is
    **4.84 Ohm**, which confirms the report's 4.91; but the worst active device, XMS's b half at
    x = 96, is **20.88 Ohm**, and the far end of row A is 20.29 Ohm. That is **1.27x** of the
    16.4772 Ohm budget, not 0.89x. The mechanism is precise and visible in the drawing: from the
    riser top the return runs 66.6 um of BARE 0.8 um Metal1 rail (measured 9.44 Ohm; a bare
    0.8 um rail is 0.1375 Ohm/um and 66.6 x 0.1375 = 9.16) before the row-A ptap ring even
    starts -- the ring segments run only from x = -3.4 to x = 105.58 (y = -2.6 and y = 11.25).
    Section 6.4 credits "170 um of 0.8 um rail in parallel with the ptap ring's two 0.6 um
    segments" over the WHOLE run; over the segment where the ring exists the parallel credit is
    right (my solve gives 5.92 Ohm for the 101 um from x = 0 to x = 101, against 5.56 Ohm for
    rail-parallel-ring and 13.9 Ohm for the bare rail), but the first 66.6 um has no ring beside
    it and is charged at the bare rate. 4.84 + 9.44 + 5.92 = 20.2, and 14.3 is what my solve
    returns for a device at x = 0 -- the NEAR end of the row, not the far end.
  effect:
    metric: psrr_1k_db
    delta: -2.0
    unit: dB
    model: hand
    detail: >-
      brief.json series_r.vss_active d_psrr_db_per_ohm = -0.45528; 20.88 - 16.48 = 4.4 Ohm over
      budget x 0.455 = 2.0 dB. No spec breaks (PSRR is 70.09 dB against a 40 dB line and the
      step is at 32 Ohm), so this is a quarter-margin budget overrun, in the same class as
      `gate` -- but it is reported as inside the budget when it is not.
  fix:
    knob: rail_w
    to: 1.4
    note: >-
      Measured, not estimated: I ran the same solve on the generator's own `rail_w = 1.4` build
      from the bounds walk (bnd/bounds/rail_w_hi, DRC 0, LVS matched, current density 0.836x)
      and the worst device drops to **15.13 Ohm** -- inside the 16.4772 Ohm budget at 0.92x --
      while the common element is unchanged at 4.84 Ohm. For contrast I also solved
      `vss_ret_w = 6.0`: it takes the common element to 2.43 Ohm and leaves the worst device at
      18.47 Ohm, still over. That is the report's own lesson restated with numbers: the riser
      width is not the lever, the ROW RAIL is. Cheaper alternative with the same effect: extend
      the row-A ptap ring (or the rail) left to meet the riser, so the 66.6 um bare section
      disappears.
  expected: "worst-device active return 20.9 -> 15.1 Ohm at rail_w = 1.4; ~2 dB of PSRR budget back"
  verdict: open

- id: F3
  severity: major
  category: objective
  title: "gate budget is a gate-only artifact: in the assembled cell the net has ~45 fF of headroom"
  where:
    - {kind: device, name: XMP pass array, x0: 47.57, y0: 61.77, x1: 87.25, y1: 64.89}
    - {kind: box, layer: Metal3drawing, x0: 46.94, y0: 3.01, x1: 98.09, y1: 60.77}
    - {kind: net, name: gate}
  evidence: >-
    Everything the report measures reproduces. `gate` extracts to 44.50 fF total / **34.45 fF
    to-rail** / 8.911 fF to `vout`; gate-only S7 is **201.744 mV** against my run of the frozen
    tran_load_step (report: 201.72); the finger-multiple lever is linear over a 4x span --
    I built and extracted at x_dut_xmp_nf_mult = 2, 4 and 8 and got to-rail **26.63 / 34.45 /
    50.03 fF**, i.e. 3.91 and 3.895 fF per unit with an intercept of **18.81 fF** (report:
    3.9/unit, ~18.8 fF floor); and nf_mult = 2 fails current density at **1.4626x** (report:
    1.46x), so it is genuinely unavailable. What the report does NOT measure, and what decides
    the ruling, is the net's headroom IN THE ASSEMBLED CELL. I swept a lumped `gate`->`vss`
    capacitor on top of the full 186-card extraction through the frozen tran_load_step:
    +0 fF S7 = 127.560 mV, +5 = 129.673, +10 = 132.100, +20 = 137.404, +40 = 147.293,
    +80 = 167.900. That is a smooth **0.44 mV/fF with no step anywhere**, crossing the 150 mV
    line at about **+45 fF** -- so the drawn 34.45 fF sits at roughly 43 % of the capacitance
    this net can actually carry. The brief's "12 fF budget with a step between 12 and 13 fF" is
    measured with every other parasitic zeroed; the assembled cell does not have that step.
  effect:
    metric: v_undershoot_mv
    delta: 22.4
    unit: mV
    model: what-if
    detail: >-
      127.560 mV drawn against the 150 mV line; the marginal sensitivity of S7 to `gate`
      to-rail capacitance measured in situ is 0.44 mV/fF, giving ~45 fF (130 % of the drawn
      value) before the spec line, at tt / 27 C.
  fix:
    knob: new feature
    note: >-
      Not a layout fix and not a topology fix -- a measurement. Before an owner is asked to
      change the pass device, change the output stage, add a certified capacitor on `ea_o1` or
      widen the S7 line (PLAN section 6b ruling 1), run the full-PEX corner and Monte-Carlo
      sweep (F16). The whole question is whether the 22.4 mV of measured margin survives ss/-40
      and mismatch; a gate-only budget cannot answer it in either direction. If the corner run
      shows the margin holds, ruling 1 dissolves; if it does not, the corner run also says by
      how much, which is what a topology decision needs.
  expected: "either the ruling closes or it acquires a number; today it has neither"
  verdict: open

- id: F16
  severity: major
  category: objective
  title: "still tt/27 only, and both owner rulings now depend on the corner + MC run"
  where:
    - {kind: net, name: (whole cell)}
  evidence: >-
    Unchanged from review-003 and now load-bearing. Every row in both scorecards is tt / 27 C
    (PLAN section 7 excludes corners explicitly, REPORT section 10.6 records it). Three things
    the re-derived brief added make this the decisive gap rather than a caveat. (1) F3's margin
    is a cancellation whose corner behaviour nobody has measured. (2) `brief.json` prices
    `ea_nmos_load` at 1.0 mV of tolerated dVT against a PDK 1-sigma of 1.6468 mV (0.607 sigma),
    and its own `out_of_box_dvt_mv` is 2.0 mV -- I checked the sigma arithmetic myself,
    sqrt(2) x A_VT / sqrt(W.L) with A_VT = 2.0 mV.um from sg13g2_moslv_mismatch.lib and
    W.L = 2.95 x 1.0 um on the WHOLE device (not per half), = 1.6468 mV, which is right. So
    P(dVT > 2.0 mV on the dangerous XM3 side) = Phi(-1.215) = **11 %** of dies, one-sided, from
    random mismatch of one class alone, before any parasitic. `bias_p_group`: out of box at
    1.5 mV, 1 sigma 1.118 mV, = **9 %** one-sided. (3) The re-certification moved Iq to
    33.81 uA, toward the S7-vs-bias-current step review-002 M6 measured near 30.7 uA at tt.
    None of the three has been simulated anywhere but the typical corner.
  effect: {metric: v_undershoot_mv, delta: null, unit: mV, model: hand, detail: "unquantified by construction -- that is the finding"}
  fix:
    knob: new feature
    note: >-
      The post-layout corner sweep the campaign already has decks for, on the extracted subckt,
      plus a mismatch Monte Carlo on the drawn device set. It is the last measurement this cell
      needs and it is the input both open rulings are missing.
  expected: "the corner + MC row; without it neither ruling can be taken"
  verdict: open

- id: F1
  severity: major
  category: pex
  title: "with the mesh stitched, the extracted vdd/vout series R is 70-140x the drawn metal"
  where:
    - {kind: box, layer: TopMetal1drawing, x0: -73.5, y0: 67.55, x1: 137.64, y1: 71.55}
    - {kind: box, layer: TopMetal1drawing, x0: 61.69, y0: 52.33, x1: 73.13, y1: 58.33}
    - {kind: device, name: XMP pass array, x0: 47.57, y0: 61.77, x1: 87.25, y1: 64.89}
    - {kind: point, x: -65.5, y: 69.55}
    - {kind: point, x: 133.64, y: 0.0}
  evidence: >-
    Re-extracted on the fixed platform (@b61f6c7, `stitch_mesh=True`): ok, `mesh_connected=True`,
    6215 mesh nodes, **220 of 243 device pins on the mesh, 0 open nets**, 19 stub nets (the 18
    divider internal nets and `lp_brk` -- the rhigh terminal-region limit). The topology defect
    review-003 F1 named is fixed. What the mesh now says, solved as a nodal network from the
    extractor's own resistor values, is that its VALUES are not usable on this cell.
    R(`vdd` port -> each of the 39 pass source columns) = **49.14 to 49.19 Ohm**, essentially
    identical for every column, i.e. a **~41 Ohm COMMON series element** in front of the whole
    array, on a path whose drawn TopMetal1 I solve at **0.59 Ohm** and whose Metal2 comb I solve
    at 0.017 Ohm. R(pass drains -> `vout` port) = **77.6 Ohm** against 0.51 Ohm of drawn metal.
    And column-to-column R is ~16 Ohm, which is the pass device's own S/D terminal region, in
    series with each 2.5 um finger. Nothing in the drawing is 41 Ohm: the vdd riser is 48 cuts
    per level on Via2/3/4 plus 12 TopVia1, so 41 Ohm is ~2 kOhm per cut -- a modelling default,
    not a via. The benches agree that this is not a circuit: 9 of 13 now TIME OUT at 600 s
    (dc_op, dropout, load and line regulation, both transients, all three loop-gain runs) where
    before they hit a singular matrix, and the four that finish return psrr_1k **-5.549 dB**
    against 70.09 and vn_out 288.1 uVrms against 361.8. The one net where the mesh IS credible is
    `vss`, and it is credible because that path is Metal1 end to end: R(`vss` port -> the 13
    active-device source nodes) = **4.11 Ohm** aggregate and **10.5 to 24.0 Ohm** per device,
    against my independent Laplace solve of the drawn Metal1 at 4.84 Ohm and 12.5 to 20.9 Ohm.
    Two methods, one built from the extractor's numbers and one from the drawn polygons, agree
    to ~15 % -- and both put the worst device over the brief's budget (F9).
  effect:
    metric: v_dropout_mv
    delta: 10.8
    unit: mV
    model: hand
    detail: >-
      The series-R number of record stays the hand model, now solved rather than estimated:
      10.34 x 0.5895 + 8.64 x 0.5446 = 10.80 mV of the brief's 23.83 mV dropout pool (45 %),
      against the report's 10.98 mV / 46 %. The extracted mesh cannot replace it yet.
  fix:
    knob: new feature
    note: >-
      Upstream, not this cell. Three things, in order of value. (1) The residual kpex defect is
      the terminal/via resistance, not the topology: ~41 Ohm of common element and ~16 Ohm per
      finger on a metal path of 0.6 Ohm. Report it with these numbers -- it is a different defect
      from the island the stitch just fixed, and it is what stops the RC row being usable.
      (2) `spicexplorer_signoff.pex` should carry a sanity gate beside `mesh_connected`: if the
      port-to-pin resistance of a supply net exceeds the drawn metal's sheet-resistance bound by
      orders of magnitude, say so rather than return the netlist. (3) The stitched file is
      `*_pex_netlist_stitched.spice` while every consumer that globs `*_pex_netlist.spice` --
      including this repo's `layout/postlayout.py` -- silently picks the RAW one; `PexResult.
      netlist_path` is right, the glob is not (F27).
  expected: "RC becomes a measurement when the terminal/via values are fixed; until then the hand model stands"
  verdict: open


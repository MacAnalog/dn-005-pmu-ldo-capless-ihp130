    "note": "capless double-mirror FVF LDO, design of record (003 optimizer winner, rounded)"}`.
    The actual sizing lives in sizing.yaml and in each deck's .param block; the file that claims
    to record it is empty, and it is now empty across a certification boundary where a new knob
    (x_dut_xmp_nf_mult) was introduced.
  effect: {metric: null, delta: null, unit: null, model: hand, detail: "no electrical effect; a provenance defect on the artifact a re-certification is supposed to pin"}
  fix: {knob: "decks/candidate/design.json", to: "the 33 resolved knobs", note: "write the resolved sizing at freeze time, or delete the key rather than carry it empty."}
  expected: "the certified deck set names its own sizing point"
  verdict: open

- id: F13
  severity: minor
  category: reproduce
  title: "vref is still labelled mid-channel, and vdd now carries two labels"
  where:
    - {kind: point, x: 8.81, y: 13.53}
    - {kind: point, x: -62.6, y: 12.83}
    - {kind: point, x: -65.5, y: 43.83}
    - {kind: point, x: -65.5, y: 69.55}
  evidence: >-
    PLAN A1 is unchanged: "`vref` + `fb` Metal1/Metal2 on the **left** edge". Read out of the
    GDS: `fb` moved and is now at (-62.600, 12.830), on the left edge -- fixed. `vref` is at
    (8.810, 13.530), 71 um inside the cell, on the same track row as before. Separately, and
    this is new, `vdd` now carries **two** labels: Metal1 (8/25) at (-65.500, 43.830) and
    TopMetal1 (126/25) at (-65.500, 69.550). That is the same ambiguity review-003 F9 raised
    for `vss` -- which label is the pin decides what the series resistance to it is -- and it is
    now resolved for `vss` (exactly one label, at (-70.000, -134.000)) and reintroduced for
    `vdd`. The TopMetal1 one is clearly the intended pin per A1; the Metal1 one is 26 um lower
    and on a different layer.
  effect: {metric: null, delta: null, unit: null, model: hand, detail: "interface clarity; F9's own lesson is that the pin location is what a series-R budget is measured to"}
  fix: {knob: "gen_ldo label placement", to: "vref on the left cell edge; one vdd label", note: "or amend PLAN A1 to say vref is an internal probe, not an edge pin."}
  expected: "one label per pin, on the edge the plan declares"
  verdict: open

- id: F20
  severity: minor
  category: matching
  title: "REPORT section 8 prints bias_n_group's tolerance as 6 mV where the brief says 5.0"
  where:
    - {kind: box, layer: Activdrawing, x0: 66.54, y0: 1.42, x1: 102.18, y1: 2.88}
  evidence: >-
    REPORT section 8's table has columns `tolerated | 1 sigma | headroom (sigma)` and the
    `bias_n_group` row reads `6 mV dVT (step) | 2.43 mV | 2.06`. 6 / 2.43 = 2.47, not 2.06.
    `brief.json` matching[] gives that class `tolerated.dvt_mv = 5.0`, `sigma.dvt_mv = 2.4318`
    and `headroom_sigma = 2.056`; BRIEF.md line 49 says "5 mV, 2.06 sigma, step at 6 mV". So the
    printed value is the STEP, not the tolerance, in a column headed "tolerated" -- and it is
    the only row where the two differ enough to notice, because the same cell is annotated
    "(step)" on `ea_nmos_load` where the printed 1.0 mV IS the tolerance (its step is at 2 mV).
    Every other row's arithmetic closes: 1.0/1.6468 = 0.607, 1.2/1.118 = 1.073,
    2.9477/1.6197 = 1.820, 0.989/0.575 = 1.72, 20.78/1.6648 = 12.48, 40.59/1.6623 = 24.42.
  effect: {metric: null, delta: null, unit: null, model: hand, detail: "no electrical effect; the one row a reader would use to check the table is the one that does not close"}
  fix: {knob: "REPORT section 8 generator", to: "print tolerated and step in separate columns", note: "the numbers are all in brief.json; the table should be generated from it, as the Iterations table is generated from iterations.yaml."}
  expected: "every row's headroom = tolerated / 1 sigma"
  verdict: open

- id: F21
  severity: minor
  category: reproduce
  title: "README's M8 row now describes the opposite of what the code does"
  where:
    - {kind: net, name: (no geometry -- README.md line 69)}
  evidence: >-
    The M8 row says the Metal2-on-Metal2 class "has a fix but ... **no case that fails without
    it**", that "the power combs are **routed around** on Metal3 (`to_track_m3`) rather than
    claimed", that `layout/test_builder.py` has "five cases", and it points at "REPORT.md
    section 10.5" for a `xmp_nf_mult = 1` short. All four are now false. `router.claim_box`
    records the comb and `to_track_m3` is gone; `test_builder.py` has nine cases; and I ran the
    negative test the row says does not exist -- copy `router.py`, make `claim_box` a no-op
    (the pre-F7 behaviour), run the suite: **4 failures**, including

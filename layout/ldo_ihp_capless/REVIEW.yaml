  title: "the stitched netlist is not the one postlayout.py picks up"
  where:
    - {kind: net, name: (no geometry -- layout/postlayout.py main)}
  evidence: >-
    The platform writes two files: `..._k25d_pex_netlist.spice` (raw, mesh island) and

findings:

- id: F1
  severity: blocker
  category: pex
  title: "RC wire-R mesh is disconnected: series resistance was never measured"
  where:
    - {kind: box, layer: TopMetal1drawing, x0: -69.5, y0: 68.55, x1: 133.0, y1: 70.55}
    - {kind: line, points: [[46.28, 55.33], [131.0, 55.33], [131.0, 0.0]]}
    - {kind: point, x: 131.0, y: 0.0}
    - {kind: point, x: -62.5, y: 69.55}
  evidence: >-
    My own kpex RC run (rev/pex_rc/..._k25d_pex_netlist.spice) has 8397 Rext_ cards over a
    6105-node mesh whose node names are all of the form <net>.$x.y. The intersection of that node
    set with the 33 device-terminal nodes is EMPTY, and with the 34 capacitor nodes is EMPTY. The
    mesh is a floating island: that, not "dangling nodes inside the rhigh serpentines"
    (REPORT.md section 5), is why 11 of 13 benches report `singular matrix`. It also means the two
    benches that do converge reproduce the CC row exactly BECAUSE the resistors are out of circuit,
    so REPORT.md section 5's conclusion -- "no metric this cell is measured on moves when the
    extracted wire resistance is put in" -- is false as stated: the wire resistance was never put
    in. Proof by simulation: with `.option rshunt=1e12` -- the one option that gives a floating
    island a DC path -- the RC netlist runs 13/13 and returns the CC row to five digits (dropout
    104.654 mV, phase margin 68.76212 deg, undershoot 127.580 mV, Iq 33.8056 uA), and the CC
    netlist with the same option returns the identical numbers. R changes nothing because R is not
    in the circuit. Without rshunt I get 6/13 converging, not the 2/13 the REPORT states, and the
    DC benches among those six return nonsense (load regulation 2.849 mV against 0.026, line
    regulation 8.181 mV against 0.056 -- the latter would fail the <= 2 mV spec line), which is
    what an ill-conditioned matrix does. A `.nodeset` seeds a guess and leaves the matrix
    singular; it is not the fix.
  effect:
    metric: v_dropout_mv
    delta: 28.5
    unit: mV
    model: hand
    detail: >-
      Hand model from the drawn geometry and the PDK's own sheet resistances
      (libs.tech/magic/ihp-sg13g2-extract.tech, TopMetal1 18 mOhm/sq typ, 21 worst): vdd pin
      (-62.5, 69.55) to the source riser TopVia1 row at x=62.47 is 125 um of 2.0 um TopMetal1 =
      62.5 sq = 1.13 Ohm (0.64x of the brief's 1.77 Ohm vdd budget); vout riser (x=72.35, y=55.33)
      to the vout pin (131.0, 0.0) is 57.6 um + 56.3 um of 2.0 um TopMetal1 = 57 sq = 1.03 Ohm
      (0.58x of the brief's 1.78 Ohm vout_pass_only budget). At brief section 4's measured
      13.24 and 13.21 mV/Ohm that is +14.9 and +13.6 mV of dropout -- about 30 % of the remaining
      dropout margin -- which BOTH delivered scorecards report as exactly zero.
  fix:
    knob: new feature
    note: >-
      The wire R has to reach the devices before any series-R claim can be made. Either give kpex
      a netlist whose device pins carry the same sub-node names as the mesh, or extract in `R`
      mode and stitch by label, or (cheapest) drop the RC claim and replace it with the hand model
      above plus a widened strap. `pwr_w` 2.0 -> 4.0 um halves both numbers and the
      current-density stage already has 3x headroom on TopMetal1. This is not a defect of this
      cell: the disconnected mesh is produced by kpex 0.3.12 driven through
      `spicexplorer_signoff.pex` in RC mode, so it will silently zero the series R of every cell
      the lane extracts. File it upstream against the platform wrapper (and have the wrapper
      refuse to return an RC netlist whose Rext_ node set does not intersect the device pins),
      not against the LDO.
  expected: "vdd + vout series R ~2.2 Ohm today; ~1.1 Ohm at pwr_w = 4.0 um; dropout +28 mV -> +14 mV"
  verdict: open

- id: F2
  severity: blocker
  category: knob
  title: "documented knob ranges contain LVS-breaking values that pass every blocker"
  where:
    - {kind: device, name: XMP, x0: 44.88, y0: 57.83, x1: 89.94, y1: 67.73}
    - {kind: box, layer: Via1drawing, x0: 47.88, y0: 61.2, x1: 86.94, y1: 65.5}
  evidence: >-
    I built every LayoutParams knob at both ends of its documented BOUNDS (gen_ldo.py:120-128) and
    ran current density + DRC + LVS on the interesting ones. Six knobs have an illegal endpoint.
    `xmp_nf_mult` = 3 (the documented MINIMUM): 57 fingers of 190/57 um snap to 3.33 um, the
    extracted device is W=189.81u against the certified 190u, LVS reports "Netlists don't match" --
    yet current density passes (0.975x) and DRC is 0. The same arithmetic breaks 6 and 7 (both
    confirmed LVS-fail); only 4, 5 and 8 are legal inside (3,8). `col_vias` = 3 and = 4 (the
    documented MAXIMUM) both extract `gate|vout` as one net -- a short -- with DRC 0 and current
    density 0.836x; only 1 and 2 are legal inside (1,4). `rail_w` = 2.0 (max) and `rb_segs` = 6
    (max) do not build at all (AssertionError). `n_dummy` = 0 (min) gives DRC 1 x M1.b.
    `pwr_band_w` = 5.0 (min) fails the current-density stage at 1.0032x. Only `guards` and
    `current_density` are blocking stages in layout/signoff.py -- DRC and LVS are recorded, not
    enforced -- so an optimizer driving that script accepts a shorted or mis-sized cell.
  effect: {metric: lvs, delta: 5, unit: "of 10 in-range values tested that fail", model: what-if}
  fix:
    knob: BOUNDS
    to: "xmp_nf_mult (4,5) plus 8; col_vias (1,2); rail_w (0.5,1.6); rb_segs {1,2,5}; n_dummy (1,2); pwr_band_w (5.1,12.0)"
    note: >-
      And add the guard the generator already has for resistors: `_seg_len` refuses an off-grid
      serpentine segment, but nothing refuses an off-grid pass-device finger width. Assert
      `W_XMP/(m*xmp_nf_mult)` lands on 0.01 um. Make DRC and LVS blocking stages in
      layout/signoff.py, or the current-density blocker is the only gate an optimizer respects.
  expected: "3 of 6 in-range xmp_nf_mult values and 2 of 4 col_vias values currently produce a cell that is not the certified circuit"
  verdict: open

- id: F3
  severity: blocker
  category: objective
  title: "undershoot <= 150 mV passes only via an error-amp-path parasitic cancellation"
  where:
    - {kind: box, layer: Metal1drawing, x0: 46.94, y0: 60.33, x1: 86.785, y1: 60.83}
    - {kind: line, points: [[47.73, 21.23], [47.73, 60.58]]}
    - {kind: line, points: [[47.44, 21.23], [98.19, 21.23]]}
    - {kind: line, points: [[-64.69, 15.63], [42.16, 15.63]]}
  evidence: >-
    What-ifs on MY CC PEX subckt through the frozen benches (all 13, tt/27): all parasitics
    S7 = 127.581 mV; no parasitics at all (the drawn devices only) 115.065 mV; **only the `gate`
    net's 14 extracted C cards, everything else zeroed: S7 = 204.495 mV, which VIOLATES the
    <= 150 mV spec line**; everything except `gate`: 109.237 mV. The increments do not add
    (115.1 + 89.4 - 5.8 = 198.7 against a measured 127.6), which is the step mechanism brief
    section 2 warns is "a change of mechanism, not a degradation of one". I then attributed the
    -77 mV of recovery by measurement, adding one net at a time back to the gate-only case
    (tran_load_step, frozen path): + `ea_o1` alone -> 124.682 mV (-79.8), + `ea_out` alone
    -> 129.124 (-75.4), + `fb` alone -> 128.590 (-75.9), + all three -> 121.882. EACH of the three
    error-amp-path nets alone recovers essentially the whole 80 mV, and the three together recover
    barely more than any one of them -- so the credit is not a per-net linear coefficient at all,
    it is one saturating mechanism: extra capacitance anywhere on the ea_o1 -> ea_out -> gate path
    slows the loop's response to the load step. REPORT.md section 6 nevertheless attributes the
    +16.9 mV parasitic part to a linear sum in which "`ea_o1` (64.9 fF, -0.181 mV/fF) gives
    ~-12 mV back". Brief section 3 note 4 says in terms that the -0.18 mV/fF credit is for
    DELIBERATE capacitance to a rail and "must not be banked from incidental routing", and brief
    section 2 puts `fb` under a budget, not a credit. The 22 mV of S7 margin in the delivered
    scorecard is that forbidden credit, and because the mechanism saturates it will not scale the
    way the report's per-fF coefficients say it will.
  effect: {metric: v_undershoot_mv, delta: 89.4, unit: mV, model: what-if}
  fix:
    knob: new feature
    note: >-
      Measured scaling of the `gate` net over three PEX runs: 36.10 fF at xmp_nf_mult = 2,
      47.49 fF at 4, 70.83 fF at 8 -- i.e. 5.8 fF per unit of xmp_nf_mult from the 38.75 um
      Metal1 + GatPoly gate bar, on a 24 fF fixed remainder. The current-density fix (1 -> 4) cost
      ~17 fF of `gate`, 58 % of the brief's entire 29.3 fF budget. xmp_nf_mult = 2 puts `gate`
      back inside budget (26.5 fF to a rail) but leaves the shared column 1.46x over the Metal1
      limit, so xmp_nf_mult is not a usable fix on its own. The fix is a NEW FEATURE: drive
      the pass gate from a Metal2/Metal3 bus over the array so the Metal1 gate bar is stubs rather
      than a 38.75 x 0.5 um plate, and expose GPAD (hard-coded 0.5) as a knob. Note also that
      xmp_nf_mult = 8, which passes every gate in the lane today, puts `gate` at 70.8 fF total /
      51.3 fF to a rail -- and 34.5 fF to a rail already gives 204 mV on its own, so 8 is not a
      safe value even though nothing refuses it.
  expected: "gate to-rail must come below ~30 fF for S7 to be robust without the error-amp-path credit; it is 34.5 fF today and 51.3 fF at the top of the knob range"
  verdict: open

- id: F4
  severity: major
  category: reproduce
  title: "current-density table claims 4 Via1 per pass column; 2 are drawn"
  where:
    - {kind: box, layer: Via1drawing, x0: 47.88, y0: 64.9, x1: 86.94, y1: 65.4}
    - {kind: box, layer: Via1drawing, x0: 47.88, y0: 61.3, x1: 86.94, y1: 61.8}
  evidence: >-
    gen_ldo.py:747-748 emits `n_vias=p.col_vias ** 2` = 4, but gen_ldo.py:737/741 calls
    `via_row(..., n=p.col_vias, rows=p.col_vias)`, which lays `n` cuts over `rows` rows = 2 cuts.
    Counted in the GDS: 77 S/D columns, exactly 2 Via1 each (155 cuts in the array band, the odd
    one being the ntap-ring stack). The REPORT.md section 2 table therefore reads "via1 x4,
    limit 1.60 mA, 0.165x" where the drawing is "via1 x2, limit 0.80 mA, 0.329x". The stage that
    exists precisely because it reads the DRAWN geometry (review-002 B1) does not, on this row.
    Same table: the source-side diffusion contacts have no budget row at all (only the drain side),
    and the contact count is asserted as 4 where the PDK cell draws 7 per column (measured).
  effect: {metric: current_density_headroom, delta: 2.0, unit: "x over-stated on the Via1 rows", model: what-if}
  fix: {knob: gen_ldo.power_budgets, to: "n_vias=p.col_vias", note: "and add the vdd-side contact row; better, count the cuts out of the built Component instead of recomputing them"}
  expected: "table verdict unchanged (worst stays 0.836x on the Metal2 comb spine) but two rows are wrong by 2x"
  verdict: open

- id: F5
  severity: major
  category: routing
  title: "fb track is 107 um and crosses into the right half (PLAN 6 asked for short)"
  where:
    - {kind: line, points: [[-62.89, 12.83], [44.26, 12.83]]}
    - {kind: box, layer: PolyResdrawing, x0: -66.0, y0: -49.5, x1: -31.1, y1: -5.78}
    - {kind: device, name: XM1a, x0: 31.07, y0: 26.16, x1: 32.87, y1: 31.545}
    - {kind: device, name: XM1b, x0: 44.21, y0: 26.16, x1: 46.01, y1: 31.545}
  evidence: >-
    PLAN.md section 6 constrains `fb` to "a SHORT track: the divider is placed so `fb` reaches
    XM1's gate without crossing the cell; it is kept off the right half (vout/gate edges)
    entirely". Measured from the GDS, the `fb` Metal1 track is (-62.89, 12.73)-(44.26, 12.93):
    107.15 um long, 53 % of the cell width, and it ends at x = +44.26 where the cell's x midpoint
    is +31.75. It is the second-longest signal track in the cell. The cause is the floorplan
    conflict the plan did not resolve: the divider is at the far bottom-left for thermal reasons
    (brief section 9) while `ea_in_pair` is the SECOND group in ROW_B_QUIET, at x = 26.7-50.4.
  effect: {metric: pm_loop_deg, delta: -2.85, unit: deg, model: what-if}
  fix:
    knob: new feature
    to: "swap the order of bias_p_group and ea_in_pair in ROW_B_QUIET"
    note: >-
      Putting XM1/XM2 at the left end of row B shortens `fb` by ~22 um (20 %). Hand model on the
      measured fb-only cost: -2.85 deg x 0.8 = -2.3 deg, i.e. +0.55 deg of phase margin back.
      `bias_p_group` has 7.16 sigma of headroom and no routing constraint, so it is the group that
      should take the long trip. Ask for this to be A/B'd on its own before anything else moves.
  expected: "fb 34.0 fF -> ~27 fF, phase margin 68.76 -> ~69.3 deg"
  verdict: open

- id: F6
  severity: major
  category: matching
  title: "input-pair halves get unequal routing and via counts (XOR 3.69 um2)"
  where:
    - {kind: pair, a: {x: 31.97, y: 28.9}, b: {x: 45.11, y: 28.9}}
    - {kind: pair, a: {x: 36.35, y: 28.9}, b: {x: 40.73, y: 28.9}}
    - {kind: box, x0: 26.69, y0: 26.16, x1: 50.39, y1: 36.78}
    - {kind: box, x0: 15.74, y0: 1.42, x1: 41.82, y1: 3.255}
  evidence: >-
    REPORT.md section 8 deviation 3 says "routing is not matched half-for-half ... Not measured".
    Measured. Taking each half's local window (+/-2.4 um, Metal1 + Metal2 + Via1 + Metal3) and
    XORing it against the other half translated onto it: XM1 halves XOR 3.69 um2 of 5.71 um2
    (64.7 %), Metal2 alone 3.09 um2; XM2 halves XOR 2.54 um2 of 7.74 um2 (32.8 %) and the two
    halves carry **4 and 3 Via1**. For comparison XM3 and XM4, the other common-centroid class,
    XOR to **0.000 um2** with 2 Via1 each -- so the generator can produce matched half routing,
    and does, for the 2.10 sigma class but not for the 1.85 sigma one. The device geometry itself
    is correct: ABBA with equal centroids (XM1 at x 31.07/44.21, XM2 at 35.45/39.83, both centroids
    37.64), all instances r0 (no mirroring), tied dummies at both ends.
  effect: {metric: v_out_v, delta: 0.0, unit: mV, model: hand, detail: "not simulable: routing asymmetry perturbs the local etch/stress environment, which the compact models do not carry. The measured proxy is the drain-node imbalance, ea_n 17.72 fF against ea_o1 64.91 fF."}
  fix: {knob: new feature, note: "allocate the channel columns per matching class -- reserve a mirrored column pair for the two halves of a common-centroid member before the general allocator runs -- so the halves get equal Metal2 length and equal via counts, as XM3/XM4 already do by luck of ordering."}
  expected: "XOR -> 0 um2 and equal Via1 counts on XM1/XM2, as measured today on XM3/XM4"
  verdict: open

- id: F7
  severity: major
  category: routing
  title: "obstacle map does not cover the Metal2 power comb"
  where:
    - {kind: line, points: [[47.73, 21.23], [47.73, 60.58]]}
    - {kind: box, layer: Metal2drawing, x0: 44.28, y0: 52.33, x1: 90.54, y1: 58.33}
    - {kind: box, layer: Metal2drawing, x0: 44.28, y0: 66.55, x1: 90.54, y1: 72.55}
  evidence: >-
    router.ObstacleMap.column_free only tests the Metal2 verticals the router itself registered in
    `self.verticals`; the pass array's Metal2 comb (fingers and the two 6 um spines at y = 55.33
    and 69.55) is drawn with `rect`/`h` and never registered. That is the exact hole that produced
    the it02 -> it03 `gate|vout` short, and it is closed for `gate` only, by a hard-coded
    `to_track_m3` (gen_ldo.py:788) -- the 0.3 um Metal3 hop at x = 47.73 from y = 21.08 to 60.73.
    Any other net routed into that band shorts the same way, silently: `col_vias` = 3 and = 4
    reproduce `gate|vout` today (F2), and layout/test_builder.py -- the review-002 M8 regression --
    exercises the Metal1 map only.
  effect: {metric: lvs, delta: 1, unit: "silent short reproduced at col_vias in {3,4}", model: what-if}
  fix: {knob: new feature, note: "register every drawn Metal2 rectangle (comb fingers, spines, riser pads, ring risers) in ObstacleMap.verticals as claimed spans, and add the Metal2 case to layout/test_builder.py the way M8's Metal1 case was added."}
  expected: "col_vias 3 and 4 become buildable-and-matched, or fail loudly at build time instead of silently at LVS"
  verdict: open

- id: F8
  severity: major
  category: routing
  title: "divider top (lp_brk) is never joined to vout in the GDS"
  where:
    - {kind: point, x: -59.275, y: 14.23}
    - {kind: point, x: 131.0, y: 0.0}
    - {kind: pair, a: {x: -59.275, y: 14.23}, b: {x: 131.0, y: 0.0}}
  evidence: >-
    Brief section 4 calls the sense-tap position "the tightest budget in the brief and ... a
    floorplan decision, not a width": tapped at the pass drain the vout metallisation is allowed
    0.126 Ohm, tapped at the pin 1.78 Ohm, a 14x difference. REPORT.md section 7 claims the tap is
    at the pin "by construction". It is not drawn either way: `lp_brk` is a separate pin of the
    extracted cell (the certified netlist joins it to `vout` through the 0 V loop-break source
    VLP, and layout/netlist_ref.py makes both nodes pins), and layout/postlayout.py re-inserts
    `VLP lp_brk vout` onto the flat `vout` node of the subckt. With CC there is one `vout` node,
    so the choice is invisible; with a working RC extraction it would decide between the 0.126 and
    the 1.78 Ohm budget. The integrator, not this cell, currently picks.
  effect: {metric: load_reg_mv, delta: 10.2, unit: mV, model: hand, detail: "9.9 mV/Ohm x the ~1.03 Ohm of vout TopMetal1 IF the tap ends up at the pass drain instead of the pin -- against a 5.0 mV spec line"}
  fix: {knob: new feature, note: "draw the lp_brk tap: run the divider top to the vout TopMetal1 strap at the pin end and let LVS see one net, or state in the REPORT that the tap is an integration constraint and put it in the cell's interface contract."}
  expected: "S2 load regulation is either 0.026 mV (tap at the pin) or ~10 mV (tap at the drain); today the GDS does not say which"
  verdict: open

- id: F9
  severity: major
  category: budget
  title: "vss return from the bottom pin is ~32 Ohm, 1.9x the 17 Ohm budget"
  where:
    - {kind: box, layer: Metal1drawing, x0: -68.5, y0: -134.4, x1: -67.7, y1: 0.4}
    - {kind: box, layer: Metal1drawing, x0: -68.9, y0: -134.4, x1: 132.4, y1: -133.6}
    - {kind: point, x: 31.75, y: -134.0}
    - {kind: point, x: -62.5, y: 0.0}
  evidence: >-
    Drawn: the bottom-edge vss rail (-68.9,-134.4)-(132.4,-133.6) reaches the cell's vss rail at
    y = 0 through ONE 0.8 um Metal1 vertical at x = -68.1, (-68.5,-134.4)-(-67.7, 0.4), 134.8 um
    long. At the PDK's own Metal1 sheet resistance (110 mOhm/sq typ, 135 worst) that vertical is
    18.5 Ohm and the bottom rail from the `vss` label at (31.75,-134.0) adds 13.7 Ohm: ~32 Ohm
    against the brief's 17 Ohm vss budget (which binds PSRR at -0.4413 dB/Ohm). Hand model:
    -14 dB of 1 kHz PSRR. PSRR has 30 dB of margin so nothing breaks, but the net is 1.9x over a
    measured budget and appears in neither the current-density table (it carries only 27.7 uA, so
    it is EM-safe) nor either scorecard (CC extracts no R). The cell also carries TWO `vss` Metal1
    labels -- (31.75,-134.0) on the bottom edge and (-62.5, 0.0) on the cell rail -- so which one
    is the pin, and therefore what the return resistance is, is ambiguous.
